name: Build Spectro Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main, spectro-3.0-beta ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPECTRO_SUPABASE_URL: https://fbfxtyowcxgagseqdlyz.supabase.co
      SPECTRO_SUPABASE_ANON_KEY: ${{ secrets.SPECTRO_SUPABASE_ANON_KEY || 'sb_publishable_7cUKVShHm2xZg96-2pvnOw_79AunZnU' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trova progetto Android
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            SETTINGS_FILE="$(find . -maxdepth 4 -type f -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::Non trovo settings.gradle.kts nel repository"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

            if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
              echo "::error::Trovato progetto in $PROJECT_DIR ma manca app/build.gradle.kts"
              exit 1
            fi
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Progetto Android trovato in: $PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Installa Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepara firma Spectro
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.SPECTRO_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail

          test -n "$SIGNING_BUNDLE_B64" || {
            echo "::error::Manca il secret SPECTRO_SIGNING_BUNDLE_B64"
            exit 1
          }

          SIGN_DIR="$RUNNER_TEMP/spectro-signing"
          mkdir -p "$SIGN_DIR"
          export SIGN_DIR

          python3 <<'PY'
          import os
          import re
          import base64
          import binascii
          from pathlib import Path

          raw = os.environ["SIGNING_BUNDLE_B64"]
          compact = re.sub(r"\s+", "", raw)

          # Il bundle gzip Base64 creato per Spectro inizia con H4sI.
          start = compact.find("H4sI")
          if start < 0:
              raise SystemExit("Secret non valido: non trovo l'inizio H4sI")

          compact = compact[start:]
          compact = re.sub(r"[^A-Za-z0-9+/=]", "", compact)
          compact += "=" * ((4 - len(compact) % 4) % 4)

          try:
              data = base64.b64decode(compact, validate=True)
          except (binascii.Error, ValueError) as exc:
              raise SystemExit(f"Secret bundle Base64 non valido: {exc}")

          out = Path(os.environ["SIGN_DIR"]) / "bundle.tar.gz"
          out.write_bytes(data)
          print(f"Bundle firma decodificato: {len(data)} byte")
          PY

          tar -xzf "$SIGN_DIR/bundle.tar.gz" -C "$SIGN_DIR"

          KEYSTORE_PATH="$SIGN_DIR/spectro-release.p12"
          PASSWORD_FILE="$SIGN_DIR/password.txt"
          ALIAS_FILE="$SIGN_DIR/alias.txt"

          test -s "$KEYSTORE_PATH" || {
            echo "::error::Keystore non trovato nel bundle"
            exit 1
          }
          test -s "$PASSWORD_FILE" || {
            echo "::error::Password non trovata nel bundle"
            exit 1
          }
          test -s "$ALIAS_FILE" || {
            echo "::error::Alias non trovato nel bundle"
            exit 1
          }

          KEY_PASSWORD="$(cat "$PASSWORD_FILE")"
          KEY_ALIAS="$(cat "$ALIAS_FILE")"

          echo "::add-mask::$KEY_PASSWORD"

          if ! keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Bundle firma non valido: il keystore interno non supera la verifica"
            exit 1
          fi

          echo "SPECTRO_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SPECTRO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Firma Spectro verificata correttamente"

      - name: Test logica economica
        run: gradle -p "$PROJECT_DIR" :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Compila APK RELEASE firmato
        run: gradle -p "$PROJECT_DIR" :app:assembleRelease --stacktrace --no-daemon

      - name: Verifica APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || {
            echo "::error::APK non trovato in $APK"
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          }

          echo "APK creato:"
          ls -lh "$APK"

          # Verifica anche che l'APK sia realmente firmato.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          fi

      - name: Salva APK
        uses: actions/upload-artifact@v7
        with:
          name: SpectroERP-v3.2.10-BETA20
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Pubblica APK Beta 20 con link diretto
        if: github.ref == 'refs/heads/spectro-3.0-beta'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.2.10-beta20"
          SOURCE_APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          PUBLIC_APK="SpectroERP-v3.2.10-BETA20.apk"
          PUBLIC_ZIP="SpectroERP-v3.2.10-BETA20.zip"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PUBLIC_APK"
            zip -j "$PUBLIC_ZIP" "$PUBLIC_APK"
            gh release upload "$TAG" "$PUBLIC_ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          else
            cp "$SOURCE_APK" "$PUBLIC_APK"
            zip -j "$PUBLIC_ZIP" "$PUBLIC_APK"
            gh release create "$TAG" "$PUBLIC_APK" "$PUBLIC_ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Spectro ERP 3.2.10 Beta 20" \
              --notes "APK Android RELEASE firmato. Installare sopra la versione esistente senza disinstallare l'app." \
              --prerelease
          fi
