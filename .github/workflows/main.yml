name: Build Spectro Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Installa Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verifica secrets firma
        env:
          KEYSTORE_B64: ${{ secrets.SPECTRO_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SPECTRO_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Manca il secret SPECTRO_KEYSTORE_B64"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Manca il secret SPECTRO_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > app/spectro-release.jks
          keytool -list -keystore app/spectro-release.jks -storepass "$KEY_PASSWORD" -alias spectro >/dev/null
          echo "Firma Spectro pronta"

      - name: Test logica economica
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Compila APK RELEASE firmato
        env:
          SPECTRO_KEYSTORE_PATH: spectro-release.jks
          SPECTRO_KEY_PASSWORD: ${{ secrets.SPECTRO_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verifica APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Salva APK
        uses: actions/upload-artifact@v7
        with:
          name: SpectroERP-v2.1.0-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
